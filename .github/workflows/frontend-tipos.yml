name: Frontend - tipos da API

# Gate da #273: os tipos de frontend/app/lib/api-types.ts são gerados de
# backend/schema.yml. Se o schema mudar e os tipos não forem regenerados, ou se
# o código do frontend deixar de bater com eles, o PR não passa.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/schema.yml"
      - ".github/workflows/frontend-tipos.yml"

concurrency:
  group: frontend-tipos-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  tipos:
    name: Tipos da API em dia e frontend compilando
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Falha se api-types.ts não for o que o schema commitado gera.
      # Para corrigir: `npm run gen:api-types` e commitar o resultado.
      - name: Conferir api-types.ts contra backend/schema.yml
        run: npm run check:api-types

      # Com os tipos em dia, campo removido ou renomeado no backend aparece aqui.
      - name: Compilar o frontend com os tipos gerados
        run: npm run typecheck
