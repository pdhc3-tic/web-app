name: Deploy

# Push na main: testes → imagens no GHCR (tag = sha) → deploy no pdhc-app.
# O compose e o runbook de produção vivem no archelos-devops (deploy/pdhc/);
# este workflow só entrega imagens e pede ao servidor que promova os digests
# construídos AQUI, no mesmo run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmo_migracao_destrutiva:
        description: "Li as migrations destrutivas desta versão e o aviso foi dado"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Testes do backend
    runs-on: ubuntu-latest
    outputs:
      destrutiva: ${{ steps.guard.outputs.destrutiva }}
    services:
      postgres:
        # Mesma versão do pdhc-db.
        image: postgres:18.7@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a trava de migration compara com o commit anterior do push

      - name: Construir imagem de testes
        run: docker build -t pdhc-backend-test -f backend/Dockerfile.prod backend

      # A chave é gerada no job e só cifra o banco efêmero do CI. A chave de
      # produção nunca passa pelo GitHub (custódia no cofre da Archelos Dev).
      - name: Montar env do CI
        run: |
          cat > ci.env <<EOF
          DJANGO_SECRET_KEY=ci-only-secret
          FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          DB_NAME=app_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=127.0.0.1
          DB_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          SKIP_PERFORMANCE_TESTS=1
          EOF
          echo "MANAGE=docker run --rm --network host --env-file ci.env pdhc-backend-test python manage.py" >> "$GITHUB_ENV"

      - name: Verificar migrations
        run: $MANAGE makemigrations --check --dry-run

      - name: Executar pytest
        run: docker run --rm --network host --env-file ci.env pdhc-backend-test pytest -v

      - name: Procurar migration destrutiva
        id: guard
        if: github.event_name == 'push'
        run: .github/scripts/migracoes-destrutivas.sh "${{ github.event.before }}" "$GITHUB_SHA"

  build-push:
    name: Imagens no GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.push.outputs.backend }}
      frontend: ${{ steps.push.outputs.frontend }}
      nginx: ${{ steps.push.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Uma imagem de backend serve backend, worker, beat e migrate. O front vai
      # sem NEXT_PUBLIC_API_URL (vazio = API na mesma origem, via nginx).
      - name: Build e push (tag = sha)
        id: push
        run: |
          set -euo pipefail
          for nome in backend frontend nginx; do
            ref="$IMAGEM/$nome:$GITHUB_SHA"
            docker build -t "$ref" -f "$nome/Dockerfile.prod" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "$nome"
            docker push "$ref"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)
            echo "$nome=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Deploy no pdhc-app
    needs: [test, build-push]
    # Push: automático, salvo migration destrutiva. Manual: só com a confirmação marcada.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.outputs.destrutiva == 'false') ||
        (github.event_name == 'workflow_dispatch' && inputs.confirmo_migracao_destrutiva)
      )
    runs-on: ubuntu-latest
    # Secrets só deste environment, liberado apenas para a main.
    environment: production
    steps:
      # A chave só executa /opt/pdhc/bin/promover no servidor (forced command):
      # nada de shell. O servidor valida sha e digests antes de qualquer coisa.
      - name: Promover os digests deste run
        env:
          SSH_KEY: ${{ secrets.PDHC_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PDHC_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.PDHC_DEPLOY_HOST }}
          BACKEND: ${{ needs.build-push.outputs.backend }}
          FRONTEND: ${{ needs.build-push.outputs.frontend }}
          NGINX: ${{ needs.build-push.outputs.nginx }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$HOST" "$GITHUB_SHA $BACKEND $FRONTEND $NGINX"

  notify:
    name: Notificar Slack
    needs: [test, build-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Só etapa, commit e link do run: linhas de log podem levar dado pessoal.
      - name: Notificar
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TESTE: ${{ needs.test.result }}
          BUILD: ${{ needs.build-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
          DESTRUTIVA: ${{ needs.test.outputs.destrutiva }}
        run: |
          set -euo pipefail
          if [ "$TESTE" != success ]; then
            texto="🚨 Deploy do PDHC falhou nos testes"
          elif [ "$BUILD" != success ]; then
            texto="🚨 Deploy do PDHC falhou no build das imagens"
          elif [ "$DEPLOY" = skipped ] && [ "$DESTRUTIVA" = true ]; then
            texto="⏸️ Deploy do PDHC parado: migration destrutiva. Liberar pelo workflow manual depois do aviso"
          elif [ "$DEPLOY" = skipped ]; then
            texto="⏸️ Deploy do PDHC não executado (workflow manual sem a confirmação)"
          elif [ "$DEPLOY" != success ]; then
            texto="🚨 Deploy do PDHC falhou na promoção no servidor"
          else
            texto="🚀 Deploy do PDHC concluído"
          fi
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg t "$texto · ${GITHUB_SHA::7} · <$run_url|ver o run>" '{text: $t}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
