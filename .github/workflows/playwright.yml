name: Playwright E2E

on:
  pull_request:
    branches: [main]

concurrency:
  group: playwright-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    # Orçamento do job inteiro: build da imagem, migrações, seed e instalação do
    # Playwright vêm antes dos testes. O limite de 5 min pedido no review vale
    # para a suíte, e está no timeout do passo "Executar testes Playwright".
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Criar .env do backend para CI
        run: |
          cat > backend/.env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-secret
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          DB_NAME=app_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=app_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF
          # AES-256 em base64 de 32 bytes, exigida por apps/core/crypto.py; sem
          # ela as migrações abortam com ImproperlyConfigured. Efêmera: a massa
          # do seed_demo nasce e morre dentro do job.
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> backend/.env

      - name: Criar .env do frontend para CI
        run: |
          cat > frontend/.env.local <<'EOF'
          NEXTAUTH_SECRET=ci-only-secret
          NEXTAUTH_URL=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      # Antes de subir o Docker, de proposito: o compose monta ./frontend:/app
      # com um volume anonimo em /app/node_modules, e ao preparar esse mount o
      # Docker cria ./frontend/node_modules no host pertencendo ao root. Depois
      # disso o npm ci do runner morre com EACCES ao escrever ali.
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Subir stack Docker
        run: docker compose up -d --build --wait
        timeout-minutes: 4

      - name: Aplicar migrações
        run: docker compose exec -T backend python manage.py migrate --noinput

      # seed_demo depende dos dados de referência do core: sem eles, _tecnicos()
      # aborta em Role.DoesNotExist. É o passo 5 do README, anterior ao seed
      # de demonstração. A ressalva do docstring de seed_core ("não usar em
      # CI") vale para os testes unitários, que montam fixtures com
      # factory_boy; o E2E exerce a aplicação real e precisa da massa real.
      - name: Seed de referência do core
        run: docker compose exec -T backend python manage.py seed_core

      - name: Seed de demonstração
        run: docker compose exec -T backend python manage.py seed_demo --reset

      - name: Executar testes Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: "true"
        run: |
          start=$(date +%s)
          npx playwright test --timeout=60000
          end=$(date +%s)
          echo "Duração da suíte: $((end - start))s"
        timeout-minutes: 5

      - name: Coletar logs dos containers
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose logs --no-color --timestamps > ci-logs/containers.log 2>&1 || true
          docker compose ps --all > ci-logs/containers-ps.txt 2>&1 || true

      - name: Publicar artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ci-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Parar stack Docker
        if: always()
        run: docker compose down -v
