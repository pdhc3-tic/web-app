name: Playwright E2E

on:
  pull_request:
    branches: [main]

concurrency:
  group: playwright-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Criar .env do backend para CI
        run: |
          cat > backend/.env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-secret
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          DB_NAME=app_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=app_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF
          # Chave descartável: o banco do E2E nasce vazio a cada execução, então
          # nada criptografado precisa ser lido com a chave de outra rodada.
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> backend/.env

      - name: Criar .env do frontend para CI
        run: |
          cat > frontend/.env.local <<'EOF'
          NEXTAUTH_SECRET=ci-only-secret
          NEXTAUTH_URL=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      # Antes do compose: o volume anônimo em /app/node_modules faz o Docker
      # criar frontend/node_modules como root no runner, e um npm ci depois
      # disso falha com EACCES. Se a pasta já existe, o Docker só monta o
      # volume por cima, sem mudar o dono.
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes de componente (Vitest)
        working-directory: frontend
        run: npm test

      - name: Subir stack Docker
        run: docker compose up -d --build --wait
        timeout-minutes: 4

      - name: Aplicar migrações
        run: docker compose exec -T backend python manage.py migrate --noinput

      - name: Seed de referência (perfis, estados, territórios)
        run: docker compose exec -T backend python manage.py seed_core

      - name: Seed de demonstração
        run: docker compose exec -T backend python manage.py seed_demo --reset

      - name: Executar testes Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: "true"
        run: |
          start=$(date +%s)
          npx playwright test --timeout=60000
          end=$(date +%s)
          echo "Duração da suíte: $((end - start))s"
        # 5 min não cabe mais: o setup loga 7 usuários e o backend aceita 5 logins
        # a cada 5 min (auth_login), então ele espera uma janela inteira antes do
        # 6º; e a suíte roda com workers: 1 (as specs dividem o banco do seed).
        # O teto aqui é só uma proteção contra execução travada.
        timeout-minutes: 60

      - name: Publicar artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Parar stack Docker
        if: always()
        run: docker compose down -v
