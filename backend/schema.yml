  /api/v1/sgp/atividades/calendario/:
    get:
      operationId: v1_sgp_atividades_calendario_retrieve
      description: |-
        GET /api/v1/sgp/atividades/calendario/?inicio=YYYY-MM-DD&fim=YYYY-MM-DD

        Retorna payload reduzido de todas as atividades cujo intervalo
        (data_inicio, data_fim) intersecciona com o período solicitado.
        Máximo de 90 dias entre inicio e fim (retorna 400 se excedido).

        Filtros opcionais via querystring:
            tecnico_id, projeto, acao, tipo_atividade, status
      parameters:
      - in: query
        name: acao
        schema:
          type: integer
      - in: query
        name: fim
        schema:
          type: string
          format: date
        description: Até 90 dias após `inicio`.
        required: true
      - in: query
        name: inicio
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: projeto
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - adiada
          - agendado
          - cancelada
          - concluido
          - concluido_sem_evidencia
          - em_andamento
          - nao_realizada
          - planejado
      - in: query
        name: tecnico_id
        schema:
          type: integer
      - in: query
        name: tipo_atividade
        schema:
          type: string
          enum:
          - ater
          - atividade_interna
          - curso_capacitacao
          - dia_de_campo
          - dia_de_partilha
          - encontro
          - intercambio
          - oficina
          - outro
          - pesquisa_de_campo
          - reuniao_comunitaria
          - seminario
          - visita_tecnica
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCalendarioResposta'
          description: ''
  /api/v1/sgp/atividades/exportar/:
    get:
      operationId: v1_sgp_atividades_exportar_retrieve
      description: |-
        GET /api/v1/sgp/atividades/exportar/?formato=csv|xlsx&periodo_inicio=&periodo_fim=&territorio_id=&acao_id=

        Download direto no escopo territorial do usuário. O mesmo dataset está
        disponível pelo fluxo assíncrono (`POST /sgp/exportacoes/`, tipo `atividades`).
      parameters:
      - in: query
        name: acao_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: formato
        schema:
          enum:
          - csv
          - xlsx
          type: string
          minLength: 1
        description: |-
          * `csv` - csv
          * `xlsx` - xlsx
        required: true
      - in: query
        name: periodo_fim
        schema:
          type: string
          format: date
      - in: query
        name: periodo_inicio
        schema:
          type: string
          format: date
      - in: query
        name: territorio_id
