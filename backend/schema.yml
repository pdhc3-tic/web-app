  /api/v1/sgd/demandas/:
    get:
      operationId: v1_sgd_demandas_list
      description: |-
        Pressupõe que `self.get_queryset()` devolve o queryset com o escopo de
        visibilidade já aplicado (`demand_visibility_scope`).
      parameters:
      - in: query
        name: acao
        schema:
          type: number
      - in: query
        name: activity
        schema:
          type: integer
        description: Id da atividade.
      - in: query
        name: aguardando_minha_acao
        schema:
          type: boolean
        description: '`true` aplica a fila do perfil autenticado (a mesma da rota
          de contagem).'
      - in: query
        name: atividade
        schema:
          type: number
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: meta
        schema:
          type: number
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -valor_estimado_total
          - valor_estimado_total
        description: Sem o parâmetro, as mais recentes primeiro.
      - in: query
        name: periodo_fim
        schema:
          type: string
          format: date
      - in: query
        name: periodo_inicio
        schema:
          type: string
          format: date
      - in: query
        name: responsavel_etapa_atual
        schema:
          type: number
      - in: query
        name: rubrica
        schema:
          type: string
      - in: query
        name: solicitante
        schema:
          type: number
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - autorizada
            - cancelada
            - concluida
            - devolvida
            - em_atendimento
            - pre_autorizada
            - rascunho
            - recusada
            - submetida
        description: 'Repetível (`?status=a&status=b`): devolve a união dos status.'
        explode: true
      - in: query
        name: submeta
        schema:
          type: number
      - in: query
        name: territorio
        schema:
          type: number
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - alimentacao
          - diaria
          - equipamento
          - grafico
          - passagem
          - veiculo
        description: |-
          * `diaria` - Diárias
          * `passagem` - Passagens Aéreas
          * `veiculo` - Locação de Veículo
          * `grafico` - Material Gráfico
          * `alimentacao` - Alimentação
          * `equipamento` - Aquisição de Equipamentos
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: v1_sgd_demandas_create
      description: |-
        Pressupõe que `self.get_queryset()` devolve o queryset com o escopo de
        visibilidade já aplicado (`demand_visibility_scope`).
      tags:
      - v1
      security:
