    MembroDetail:
      type: object
      description: |-
        Remove do payload de saída os campos declarados em `sensitive_fields`
        (e seus companheiros `*_display`, se listados) quando o usuário da
        requisição não tem permissão de leitura sobre o campo sensível
        correspondente.

        Os campos são OMITIDOS da resposta — nunca retornados como `null` ou
        mascarados — para não sugerir a um perfil sem permissão que o dado existe.

        Uso:
            class MembroDetailSerializer(SensitiveFieldsSerializerMixin, serializers.ModelSerializer):
                sensitive_fields = {
                    "saude": ("saude",),
                    "cor_raca": ("cor_raca", "cor_raca_display"),
                }
      properties:
        id:
          type: integer
          readOnly: true
        upf:
          type: integer
          readOnly: true
          nullable: true
        nome_completo:
          type: string
          maxLength: 255
        data_nascimento:
          type: string
          format: date
          nullable: true
          title: Data de Nascimento
        idade:
          type: integer
          nullable: true
          readOnly: true
        cpf:
          type: string
          maxLength: 14
        rg:
          type: string
          maxLength: 20
        nis:
          type: string
          maxLength: 11
        caf:
          type: string
          maxLength: 30
        grau_parentesco:
          allOf:
          - $ref: '#/components/schemas/GrauParentescoEnum'
          title: Grau de Parentesco
        grau_parentesco_display:
          type: string
          readOnly: true
        genero:
          nullable: true
          title: Gênero
          minimum: 0
          maximum: 32767
          oneOf:
          - $ref: '#/components/schemas/GeneroEnum'
          - $ref: '#/components/schemas/NullEnum'
        genero_display:
          type: string
          readOnly: true
        cor_raca:
          nullable: true
          title: Cor/Raça
          description: |-
            Armazenado criptografado em repouso (AES-256-GCM). Leitura restrita por perfil — ver apps.core.sensitive_fields.

            * `1` - Branca
            * `2` - Preta
            * `3` - Parda
            * `4` - Amarela
            * `5` - Indígena
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/CorRacaEnum'
          - $ref: '#/components/schemas/NullEnum'
        cor_raca_display:
          type: string
          readOnly: true
        escola:
          type: string
          maxLength: 255
        seguridade_social: {}
        saude:
          title: Condições de Saúde
          description: Armazenado criptografado em repouso (AES-256-GCM). Leitura
            restrita por perfil — ver apps.core.sensitive_fields.
        escolaridade:
          nullable: true
          minimum: 0
          maximum: 32767
          oneOf:
          - $ref: '#/components/schemas/EscolaridadeEnum'
          - $ref: '#/components/schemas/NullEnum'
        escolaridade_display:
          type: string
          readOnly: true
        criado_por:
          type: integer
          readOnly: true
          nullable: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
        device_id:
          type: string
          readOnly: true
          description: Identificador do dispositivo de origem (sync SCA).
        uuid_local:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: UUID gerado pelo dispositivo para idempotência no sync SCA.
        ultima_origem:
          allOf:
          - $ref: '#/components/schemas/UltimaOrigemEnum'
          readOnly: true
          title: Última Origem
          description: |-
            Indica se a última alteração partiu do app SCA ou da plataforma Web.

            * `sca` - SCA
            * `web` - Web
        ultimo_sync_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último Sync SCA
          description: Timestamp da última sincronização bem-sucedida via SCA.
      required:
      - atualizado_em
      - criado_em
      - criado_por
      - device_id
      - escolaridade_display
      - genero_display
      - grau_parentesco
      - grau_parentesco_display
      - id
      - idade
      - nome_completo
      - ultima_origem
      - ultimo_sync_em
      - upf
      - uuid_local
