  /api/v1/sgp/atividades/:
    get:
      operationId: v1_sgp_atividades_list
      description: |-
        ViewSet de Atividades do SGP.

        GET/POST    /api/v1/sgp/atividades/
        GET/PATCH/PUT/DELETE /api/v1/sgp/atividades/{id}/

        Isolamento territorial (RLS):
            - super-admin / ugp: visualizam tudo
            - articulador-estadual: atividades nos estados do seu escopo
            - adt-acr: atividades nos territórios vinculados
      parameters:
      - in: query
        name: acao
        schema:
          type: number
        description: Ação
      - in: query
        name: atrasada
        schema:
          type: boolean
        description: Atrasada
      - in: query
        name: data_inicio_after
        schema:
          type: string
          format: date
        description: Data Início (após)
      - in: query
        name: data_inicio_before
        schema:
          type: string
          format: date
        description: Data Início (antes)
      - in: query
        name: google_calendar_sync_status
        schema:
          type: string
          title: Status de Sync Google Calendar
          enum:
          - erro
          - ok
          - pendente
        description: |-
          Sincronização com o Google Calendar

          * `pendente` - Pendente
          * `ok` - OK
          * `erro` - Erro
      - in: query
        name: indicador
        schema:
          type: number
        description: Indicador
      - in: query
        name: meta
        schema:
          type: number
        description: Meta
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - in: query
        name: osc
        schema:
          type: number
        description: OSC do Técnico Responsável
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: parceiro
        schema:
          type: integer
        description: Parceiro (Organização)
      - in: query
        name: projeto
        schema:
          type: number
        description: Projeto
      - in: query
        name: q
        schema:
          type: string
        description: Busca por título
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - adiada
            - agendado
            - cancelada
            - concluido
            - concluido_sem_evidencia
            - em_andamento
            - nao_realizada
            - planejado
        description: |-
          Status

          * `planejado` - Planejado
          * `agendado` - Agendado
          * `em_andamento` - Em andamento
          * `concluido` - Concluído
          * `concluido_sem_evidencia` - Concluído sem evidência
          * `adiada` - Adiada
          * `nao_realizada` - Não realizada
          * `cancelada` - Cancelada
        explode: true
        style: form
      - in: query
        name: submeta
        schema:
          type: number
        description: Submeta
      - in: query
        name: tecnico_id
        schema:
          type: number
        description: Técnico Responsável
      - in: query
        name: territorio_id
        schema:
          type: number
        description: Território
      - in: query
        name: tipo_atividade
        schema:
          type: string
          title: Tipo de Atividade
          enum:
          - ater
          - atividade_interna
          - curso_capacitacao
          - dia_de_campo
          - dia_de_partilha
          - encontro
          - intercambio
          - oficina
          - outro
          - pesquisa_de_campo
          - reuniao_comunitaria
          - seminario
          - visita_tecnica
        description: |-
          Tipo de Atividade

          * `visita_tecnica` - Visita técnica
          * `reuniao_comunitaria` - Reunião comunitária
          * `oficina` - Oficina
          * `intercambio` - Intercâmbio
          * `curso_capacitacao` - Curso/Capacitação
          * `dia_de_campo` - Dia de campo
          * `seminario` - Seminário
          * `encontro` - Encontro
          * `dia_de_partilha` - Dia de partilha
          * `atividade_interna` - Atividade interna
          * `pesquisa_de_campo` - Pesquisa de campo
          * `ater` - Assistência técnica/ATER
          * `outro` - Outro
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityListList'
          description: ''
